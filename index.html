document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:9.5px; font-weight:800; letter-spacing:.16em; color:#8FA6B8; margin-bottom:8px;\">PÚBLICO<\u002Fspan>\n            <div style=\"display:flex; gap:7px; flex-wrap:wrap;\">\n              <sc-for list=\"{{ audOpts }}\" as=\"au\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ au.go }}\" style=\"cursor:pointer; padding:9px 13px; border-radius:8px; font-size:10.5px; font-weight:800; letter-spacing:.06em; background:{{ au.bg }}; color:{{ au.fg }}; border:1px solid {{ au.bd }};\">{{ au.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ genCopys }}\" style=\"cursor:pointer; border:none; background:#FE5D0A; color:#FFFFFF; font-size:13px; font-weight:800; letter-spacing:.06em; padding:15px 20px; border-radius:10px;\">{{ genLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:column; gap:16px;\">\n          <sc-for list=\"{{ copyCards }}\" as=\"c\" hint-placeholder-count=\"3\">\n            <div style=\"background:#012E53; border:1px solid rgba(237,237,237,.10); border-radius:16px; padding:24px 24px; display:flex; flex-direction:column; gap:14px;\">\n              <div style=\"display:flex; align-items:center; justify-content:space-between; gap:14px;\">\n                <span style=\"font-size:11px; font-weight:800; letter-spacing:.14em; color:#FE8401;\">{{ c.ix }}<\u002Fspan>\n                <button sc-camel-on-click=\"{{ c.toStudio }}\" style=\"cursor:pointer; background:transparent; color:#EDEDED; border:1px solid rgba(237,237,237,.20); font-size:10.5px; font-weight:800; letter-spacing:.08em; padding:8px 13px; border-radius:8px;\">CRIAR ARTE →<\u002Fbutton>\n              <\u002Fdiv>\n              <h3 style=\"margin:0; font-weight:900; letter-spacing:-.02em; font-size:26px; line-height:1.05; color:#FFFFFF; text-wrap:balance;\">{{ c.titulo }}<\u002Fh3>\n              <p style=\"margin:0; font-size:14.5px; line-height:1.6; color:#B4C4D2; white-space:pre-line; text-wrap:pretty;\">{{ c.legenda }}<\u002Fp>\n              <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding-top:4px; border-top:1px solid rgba(237,237,237,.08);\">\n                <span style=\"font-size:11px; font-weight:700; letter-spacing:.1em; color:#7C93A8; padding-top:12px;\">{{ c.hashtags }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isLib }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"width:100%; max-width:1180px; margin:0 auto; padding:clamp(32px,5vw,64px) clamp(20px,4vw,48px) 72px; display:flex; flex-direction:column; gap:30px;\">\n      <div>\n        <h1 style=\"margin:0; font-weight:900; letter-spacing:-.03em; font-size:clamp(38px,6vw,72px); line-height:.94; color:#FFFFFF;\">Biblioteca de produtos<\u002Fh1>\n        <p style=\"margin:16px 0 0; max-width:62ch; font-size:16px; line-height:1.6; color:#A9BBCA; text-wrap:pretty;\">Dados puxados do catálogo em llevlar.com.br. O preço em destaque é o do PIX ou depósito. Clique em qualquer produto e a ficha técnica abre no estúdio já preenchida.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"position:sticky; top:60px; z-index:10; display:flex; flex-direction:column; gap:14px; padding:18px 0 16px; background:#011F38; border-bottom:1px solid rgba(237,237,237,.10);\">\n        <div style=\"display:flex; gap:10px; align-items:center; flex-wrap:wrap;\">\n          <input value=\"{{ busca }}\" sc-camel-on-change=\"{{ onBusca }}\" placeholder=\"Buscar por nome, medida, material…\" style=\"flex:1; min-width:260px; padding:13px 15px; border-radius:10px; border:1px solid rgba(237,237,237,.14); background:#012E53; color:#EDEDED; font-size:14px; font-weight:500; outline:none;\" style-focus=\"border-color:#FE8401;\">\n          <span style=\"font-size:11px; font-weight:800; letter-spacing:.14em; color:#7C93A8; white-space:nowrap;\">{{ libTotal }}<\u002Fspan>\n          <button sc-camel-on-click=\"{{ limparBusca }}\" style=\"cursor:pointer; background:transparent; color:#A9BBCA; border:1px solid rgba(237,237,237,.18); font-size:10.5px; font-weight:800; letter-spacing:.08em; padding:12px 15px; border-radius:9px;\">LIMPAR<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:7px; flex-wrap:wrap;\">\n          <sc-for list=\"{{ libFiltros }}\" as=\"ft\" hint-placeholder-count=\"7\">\n            <button sc-camel-on-click=\"{{ ft.go }}\" style=\"cursor:pointer; display:flex; align-items:center; gap:7px; padding:9px 13px; border-radius:20px; font-size:10px; font-weight:800; letter-spacing:.08em; background:{{ ft.bg }}; color:{{ ft.fg }}; border:1px solid {{ ft.bd }};\">\n              <span>{{ ft.label }}<\u002Fspan>\n              <span style=\"opacity:.65;\">{{ ft.n }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ libVazio }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"margin:0; padding:40px 0; font-size:15px; color:#7C93A8;\">Nenhum produto encontrado. Tente outro termo ou limpe o filtro.<\u002Fp>\n      <\u002Fsc-if>\n      <sc-for list=\"{{ libGroups }}\" as=\"gr\" hint-placeholder-count=\"3\">\n        <div style=\"display:flex; flex-direction:column; gap:16px;\">\n          <div style=\"display:flex; align-items:center; gap:14px;\">\n            <span style=\"width:36px; height:4px; background:{{ gr.cor }}; display:block;\"><\u002Fspan>\n            <h2 style=\"margin:0; font-size:14px; font-weight:800; letter-spacing:.18em; color:#FFFFFF;\">{{ gr.nome }}<\u002Fh2>\n            <span style=\"font-size:11px; font-weight:700; letter-spacing:.12em; color:#7C93A8;\">{{ gr.total }}<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"margin:-4px 0 0; max-width:78ch; font-size:13.5px; line-height:1.6; color:#8FA6B8; text-wrap:pretty;\">{{ gr.resumo }}<\u002Fp>\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; align-items:start;\">\n            <sc-for list=\"{{ gr.itens }}\" as=\"p\" hint-placeholder-count=\"4\">\n              <div style=\"background:#012E53; border:1px solid rgba(237,237,237,.10); border-radius:16px; padding:22px 20px; display:flex; flex-direction:column; gap:14px;\">\n                <h3 style=\"margin:0; font-weight:800; letter-spacing:-.01em; font-size:17px; line-height:1.25; color:#FFFFFF; text-wrap:pretty;\">{{ p.nome }}<\u002Fh3>\n                <div style=\"display:flex; align-items:baseline; gap:10px;\">\n                  <span style=\"font-size:24px; font-weight:900; letter-spacing:-.02em; color:{{ gr.cor }};\">{{ p.pix }}<\u002Fspan>\n                  <span style=\"font-size:12px; font-weight:600; color:#7C93A8; text-decoration:line-through;\">{{ p.preco }}<\u002Fspan>\n                <\u002Fdiv>\n                <div style=\"display:flex; flex-direction:column;\">\n                  <sc-for list=\"{{ p.rows }}\" as=\"r\" hint-placeholder-count=\"4\">\n                    <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:14px; padding:9px 0; border-top:1px solid rgba(237,237,237,.08);\">\n                      <span style=\"font-size:10.5px; font-weight:700; letter-spacing:.1em; color:#7C93A8;\">{{ r.k }}<\u002Fspan>\n                      <span style=\"font-size:12.5px; font-weight:600; color:#EDEDED; text-align:right;\">{{ r.v }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <sc-if value=\"{{ p.aberto }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex; flex-direction:column; gap:14px; padding:16px 0 4px; border-top:1px solid rgba(237,237,237,.08);\">\n                    <sc-if value=\"{{ p.temDesc }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div>\n                        <span style=\"display:block; font-size:9px; font-weight:800; letter-spacing:.16em; color:#7C93A8; margin-bottom:7px;\">SOBRE ESTE PRODUTO<\u002Fspan>\n                        <p style=\"margin:0; font-size:13px; line-height:1.6; color:#B4C4D2; text-wrap:pretty;\">{{ p.desc }}<\u002Fp>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <div>\n                      <span style=\"display:block; font-size:9px; font-weight:800; letter-spacing:.16em; color:#7C93A8; margin-bottom:9px;\">PERGUNTAS FREQUENTES<\u002Fspan>\n                      <div style=\"display:flex; flex-direction:column; gap:11px;\">\n                        <sc-for list=\"{{ p.perguntas }}\" as=\"q\" hint-placeholder-count=\"4\">\n                          <div style=\"display:flex; flex-direction:column; gap:6px; padding-left:11px; border-left:2px solid rgba(254,132,1,.4);\">\n                            <span style=\"font-size:12.5px; font-weight:800; line-height:1.35; color:#EDEDED;\">{{ q.q }}<\u002Fspan>\n                            <span style=\"font-size:12.5px; line-height:1.55; color:#A9BBCA; text-wrap:pretty;\">{{ q.a }}<\u002Fspan>\n                            <button sc-camel-on-click=\"{{ q.go }}\" style=\"cursor:pointer; align-self:flex-start; margin-top:2px; background:transparent; color:#FE8401; border:none; padding:0; font-size:9.5px; font-weight:800; letter-spacing:.1em;\">VIRAR ARTE DE FAQ →<\u002Fbutton>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <div style=\"margin-top:auto; display:flex; gap:8px; flex-wrap:wrap;\">\n                  <button sc-camel-on-click=\"{{ p.go }}\" style=\"cursor:pointer; background:transparent; color:#EDEDED; border:1px solid rgba(237,237,237,.20); font-size:10.5px; font-weight:800; letter-spacing:.08em; padding:9px 14px; border-radius:8px;\">FICHA NO ESTÚDIO →<\u002Fbutton>\n                  <button sc-camel-on-click=\"{{ p.toggle }}\" style=\"cursor:pointer; background:transparent; color:#A9BBCA; border:1px solid rgba(237,237,237,.20); font-size:10.5px; font-weight:800; letter-spacing:.08em; padding:9px 14px; border-radius:8px;\">{{ p.toggleLabel }}<\u002Fbutton>\n                  <a href=\"{{ p.url }}\" target=\"_blank\" rel=\"noopener\" style=\"text-decoration:none; color:#FE8401; border:1px solid rgba(254,132,1,.35); font-size:10.5px; font-weight:800; letter-spacing:.08em; padding:9px 14px; border-radius:8px;\" style-hover=\"background:rgba(254,132,1,.12); color:#FE8401;\">VER NO SITE ↗<\u002Fa>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fmain>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isRev }}\" hint-placeholder-val=\"{{ false }}\">\n    <main style=\"width:100%; max-width:1180px; margin:0 auto; padding:clamp(32px,5vw,64px) clamp(20px,4vw,48px) 72px; display:flex; flex-direction:column; gap:30px;\">\n      <div>\n        <span style=\"display:inline-flex; align-items:center; gap:8px; font-size:10px; font-weight:800; letter-spacing:.14em; padding:6px 11px; border-radius:7px; border:1px solid {{ keyBd }}; color:{{ keyFg }};\"><span style=\"width:7px; height:7px; border-radius:50%; background:currentColor; display:block;\"><\u002Fspan>{{ keyStatus }}<\u002Fspan>\n        <h1 style=\"margin:20px 0 0; font-weight:900; letter-spacing:-.03em; font-size:clamp(38px,6vw,72px); line-height:.94; color:#FFFFFF;\">Revisão de arte<\u002Fh1>\n        <p style=\"margin:16px 0 0; max-width:64ch; font-size:16px; line-height:1.6; color:#A9BBCA; text-wrap:pretty;\">Suba a arte pronta e receba a revisão em três frentes: design, texto e conferência de produto contra o catálogo. Erro de nome, preço, medida ou promessa técnica aparece antes de o post ir ao ar.<\u002Fp>\n      <\u002Fdiv>\n\n      <div style=\"display:grid; grid-template-columns:minmax(300px,400px) 1fr; gap:26px; align-items:start;\">\n        <div style=\"background:#012E53; border:1px solid rgba(237,237,237,.10); border-radius:16px; padding:24px 22px; display:flex; flex-direction:column; gap:18px; position:sticky; top:76px;\">\n          <div>\n            <span style=\"display:block; font-size:9.5px; font-weight:800; letter-spacing:.16em; color:#8FA6B8; margin-bottom:9px;\">ARTE<\u002Fspan>\n            <sc-if value=\"{{ temRevImg }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"border-radius:12px; overflow:hidden; border:1px solid rgba(237,237,237,.14); background:#011F38; display:flex;\">\n                <img src=\"{{ revImg }}\" alt=\"\" style=\"width:100%; height:auto; display:block; max-height:420px; object-fit:contain;\">\n              <\u002Fdiv>\n            <\u002Fsc-if>\n            <label style=\"display:flex; align-items:center; justify-content:center; margin-top:10px; cursor:pointer; padding:16px; border-radius:11px; border:1px dashed rgba(237,237,237,.26); font-size:11px; font-weight:800; letter-spacing:.08em; color:#A9BBCA; text-align:center;\" style-hover=\"border-color:#FE8401; color:#FE8401;\">\n              {{ revImgLabel }}\n              <input type=\"file\" accept=\"image/*\" sc-camel-on-change=\"{{ pickRevImg }}\" style=\"display:none;\">\n            <\u002Flabel>\n          <\u002Fdiv>\n          <label style=\"display:block;\">\n            <span style=\"display:block; font-size:9.5px; font-weight:800; letter-spacing:.16em; color:#8FA6B8; margin-bottom:7px;\">CONTEXTO (OPCIONAL)<\u002Fspan>\n            <textarea value=\"{{ revCtx }}\" sc-camel-on-change=\"{{ setRevCtx }}\" placeholder=\"Ex.: post de feed sobre manta térmica foil 25 m², promoção de agosto\" rows=\"3\" style=\"width:100%; padding:12px; border-radius:10px; border:1px solid rgba(237,237,237,.14); background:#011F38; color:#EDEDED; font-size:13px; line-height:1.5; resize:vertical; outline:none;\" style-focus=\"border-color:#FE8401;\"><\u002Ftextarea>\n          <\u002Flabel>\n          <button sc-camel-on-click=\"{{ revisar }}\" style=\"cursor:pointer; border:none; background:{{ revBtnBg }}; color:#FFFFFF; font-size:13px; font-weight:800; letter-spacing:.06em; padding:15px 20px; border-radius:10px;\">{{ revBtnLabel }}<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ openKey }}\" style=\"cursor:pointer; background:transparent; color:#7C93A8; border:none; padding:0; font-size:10px; font-weight:800; letter-spacing:.1em; text-align:left;\">GERENCIAR CHAVE DE ACESSO<\u002Fbutton>\n        <\u002Fdiv>\n\n        <div style=\"display:flex; flex-direction:column; gap:16px;\">\n          <sc-if value=\"{{ revLoading }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"background:#012E53; border:1px solid rgba(254,132,1,.28); border-radius:16px; padding:26px 24px; display:flex; flex-direction:column; gap:18px;\">\n              <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:12px;\">\n                <span style=\"font-size:11px; font-weight:800; letter-spacing:.14em; color:#FE8401;\">REVISANDO A ARTE<\u002Fspan>\n                <span style=\"font-size:26px; font-weight:900; letter-spacing:-.02em; color:#EDEDED; font-variant-numeric:tabular-nums;\">{{ revSeg }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"height:6px; border-radius:99px; background:rgba(237,237,237,.10); overflow:hidden;\">\n                <div style=\"height:100%; width:{{ revPct }}; border-radius:99px; background:#FE5D0A; transition:width .9s linear;\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:9px;\">\n                <sc-for list=\"{{ revEtapas }}\" as=\"et\" hint-placeholder-count=\"5\">\n                  <div style=\"display:flex; align-items:center; gap:10px;\">\n                    <span style=\"flex:none; width:14px; text-align:center; font-size:12px; font-weight:900; color:{{ et.marcaCor }};\">{{ et.marca }}<\u002Fspan>\n                    <span style=\"font-size:13px; line-height:1.4; color:{{ et.fg }};\">{{ et.label }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <span style=\"font-size:11px; line-height:1.5; color:#5F7488;\">Uma revisão com imagem leva de 15 a 30 segundos. Não feche a página.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ revErr }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border:1px solid rgba(232,76,61,.45); background:rgba(232,76,61,.10); border-radius:14px; padding:18px 20px; display:flex; flex-direction:column; gap:6px;\">\n              <span style=\"font-size:10px; font-weight:800; letter-spacing:.14em; color:#E84C3D;\">NÃO FOI POSSÍVEL REVISAR<\u002Fspan>\n              <span style=\"font-size:13.5px; line-height:1.55; color:#EDD3D0;\">{{ revErr }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ temResult }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex; flex-direction:column; gap:16px;\">\n              <div style=\"background:#012E53; border:1px solid rgba(237,237,237,.10); border-radius:16px; padding:26px 24px; display:flex; flex-direction:column; gap:14px;\">\n                <div style=\"display:flex; align-items:center; gap:14px; flex-wrap:wrap;\">\n                  <span style=\"font-size:56px; font-weight:900; letter-spacing:-.04em; line-height:.85; color:{{ notaCor }};\">{{ nota }}<\u002Fspan>\n                  <span style=\"font-size:11px; font-weight:800; letter-spacing:.14em; padding:7px 12px; border-radius:8px; background:{{ notaCor }}; color:#FFFFFF;\">{{ veredito }}<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"margin:0; font-size:14.5px; line-height:1.6; color:#B4C4D2; text-wrap:pretty;\">{{ resumoRev }}<\u002Fp>\n                <sc-if value=\"{{ temTranscricao }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:14px 16px; border-radius:11px; background:#011F38; border:1px solid rgba(237,237,237,.10); display:flex; flex-direction:column; gap:7px;\">\n                    <span style=\"font-size:9px; font-weight:800; letter-spacing:.16em; color:#7C93A8;\">TEXTO LIDO NA ARTE — CONFIRA LETRA POR LETRA<\u002Fspan>\n                    <span style=\"font-size:13px; line-height:1.55; color:#EDEDED; white-space:pre-line;\">{{ transcricao }}<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <sc-for list=\"{{ blocos }}\" as=\"b\" hint-placeholder-count=\"3\">\n                <div style=\"background:#012E53; border:1px solid rgba(237,237,237,.10); border-radius:16px; padding:24px 24px; display:flex; flex-direction:column; gap:16px;\">\n                  <div style=\"display:flex; align-items:baseline; justify-content:space-between; gap:12px;\">\n                    <span style=\"font-size:11px; font-weight:800; letter-spacing:.14em; color:{{ b.cor }};\">{{ b.titulo }}<\u002Fspan>\n                    <span style=\"font-size:10px; font-weight:700; letter-spacing:.12em; color:#7C93A8;\">{{ b.contagem }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"display:flex; flex-direction:column; gap:14px;\">\n                    <sc-for list=\"{{ b.itens }}\" as=\"it\" hint-placeholder-count=\"3\">\n                      <div style=\"display:flex; gap:12px; align-items:flex-start;\">\n                        <span style=\"flex:none; margin-top:2px; width:9px; height:9px; border-radius:50%; background:{{ it.cor }};\"><\u002Fspan>\n                        <div style=\"display:flex; flex-direction:column; gap:5px;\">\n                          <span style=\"font-size:13.5px; font-weight:800; line-height:1.35; color: ça entre perfil 075 e 177?','O 075 é a onda baixa e o 177 é a onda alta. O calço e o parafuso precisam ser do mesmo perfil da telha, senão a peça não assenta e a fixação abre caminho para a água.'],\n      ['A telha vem com parafuso?','Só nos kits. O Kit 10 de policarbonato perfil 177 acompanha 100 calços e 100 parafusos; as telhas avulsas não incluem fixação — o parafuso telheiro com arruela de vedação é vendido à parte.'],\n      ['Tem frete grátis para telha grande?','Não. As telhas onduladas de polipropileno são enviadas somente por transportadora e não têm frete grátis, por causa do comprimento da peça.'],\n    ],\n  },\n  'Mantas térmicas': {\n    resumo: 'Mantas de subcobertura fabricadas em tecido de polipropileno, polietileno aditivado e alumínio. Fazem barreira refletiva contra o calor, ajudam a segurar goteiras e infiltrações e existem em face única (Bopp), dupla face (Bopp) e Foil TNT, de 1 a 100 m².',\n    faq: [\n      ['A manta térmica é auto adesiva?','Não. A manta não possui cola e não deve ser colada — o aviso é do próprio fabricante. A fixação é mecânica, sobre o caibro ou a estrutura, e a emenda é feita com fita de emenda aluminizada.'],\n      ['Posso usar a manta exposta ao tempo?','Não. Ela não é indicada para uso externo: trabalha como subcobertura, protegida pela telha.'],\n      ['Qual a diferença entre face única e dupla face?','Face única tem alumínio em um lado só; dupla face reflete dos dois lados. Para telhado sobre forro habitado, a dupla face tende a render mais no verão e no inverno.'],\n      ['Como escolho a metragem?','Pela área da cobertura mais a sobreposição das emendas. A Face Única Bopp 25 m², por exemplo, é um rolo de 1,20 m de largura por 20,83 m de comprimento.'],\n      ['Bopp ou Foil TNT?','Bopp é o acabamento em ráfia de polipropileno, mais fino (0,13 mm na face única). O Foil TNT tem o acabamento em manta não tecida e é o mais usado em subcobertura de telhado.'],\n    ],\n  },\n  'Fitas asfálticas': {\n    resumo: 'Fita asfáltica aluminizada auto adesiva de 0,6 mm, em rolos de 10 m e larguras de 5 a 90 cm. Veda por adesão direta — sem maçarico, sem cura — em rufo, calha, emenda de telha e ponto de parafuso.',\n    faq: [\n      ['Precisa de maçarico para aplicar?','Não. A fita é auto adesiva: sai o filme protetor e cola por pressão. Nada de chama, nada de tempo de cura.'],\n      ['Como preparar a superfície?','Limpa e seca. Poeira e umidade são as duas causas mais comuns de emenda que descola depois.'],\n      ['Qual largura escolher?','Pela largura da falha mais a sobreposição de cada lado. 5 e 10 cm para trinca e parafuso, 30 e 45 cm para rufo e calha, 60 e 90 cm para remendo de área.'],\n      ['Serve para telha cerâmica?','A versão de 90 cm tem acabamento terracota, feita para telhado; as demais são aluminizadas. Em telha branca, a resina incolor costuma ser a opção estética.'],\n    ],\n  },\n  'Impermeabilização': {\n    resumo: 'A linha que veda antes da chuva: primer asfáltico base água para preparar a superfície, manta asfáltica de polietileno para laje, chapa dreno para muro de arrimo, resina incolor para telhas e os aplicadores de silicone.',\n    faq: [\n      ['Quanto rende o primer asfáltico?','O consumo é de 0,3 a 0,5 litro por m². O galão de 3,6 L e o balde de 18 L são base água, na cor marrom escuro.'],\n      ['Para que serve o primer?','Ele prepara e sela a superfície antes da manta asfáltica, melhorando a aderência. Sem primer, a manta tende a soltar nos cantos.'],\n      ['A resina incolor serve para qualquer telha?','A Telhacqua é uma emulsão de polímeros 100% acrílicos, plastificados e biocidas (anti mofo e anti bolor), indicada para telhas brancas.'],\n      ['Quando usar a chapa dreno?','Em muro de arrimo e túneis, onde a água precisa de caminho para escoar em vez de ficar pressionando a estrutura. Existe em 1,05 × 15 m e 2,10 × 15 m.'],\n    ],\n  },\n  'Proteção e ventilação': {\n    resumo: 'Passarinheiras, placas anti maritacas, grades de ventilação canalete e placas de vedação: fecham o vão entre a telha e a estrutura sem abrir mão da circulação de ar.',\n    faq: [\n      ['Passarinheira e placa anti maritacas são a mesma coisa?','Fazem o mesmo trabalho de fechar o vão da telha. A passarinheira vem em metros lineares para corrida inteira; a placa em régua é peça avulsa de 95 cm.'],\n      ['Qual modelo serve na minha telha?','Existe versão por modelo: Romana/Portuguesa, Amianto, Cerâmica e Universal. A Universal metálica atende a maioria dos perfis.'],\n      ['Fechar o vão não abafa o telhado?','Por isso existe a grade de ventilação canalete — ela fecha a passagem do pássaro e mantém o ar circulando. Há versão para canalete 44 e canalete 90.'],\n    ],\n  },\n  'Reformas e lonas': {\n    resumo: 'Lona plástica impermeável carreteiro com ilhoses e protetores de piso em plástico bolha reutilizável, para proteger obra e acabamento durante a reforma.',\n    faq: [\n      ['Qual a espessura da lona carreteiro?','100 micras, na cor azul, com ilhoses para amarração. Disponível em 3 × 5 m e 4 × 4 m.'],\n      ['O protetor de piso pode ser reaproveitado?','Sim, o ATCO Protege Pro de 25 m² é reutilizável. Há também a versão de 60 m² em polietileno reciclável.'],\n    ],\n  },\n};\n\n/* Texto próprio do SKU, quando o site traz algo além da metragem. */\nconst DESC = {\n  'mt-fu-25': 'Rolo de 1,20 m de largura por 20,83 m de comprimento, 25 m² no total. Espessura de 0,13 mm com estrutura em PP — ráfia de polipropileno.',\n  'mt-foil-25': 'Vem com uma fita de emenda aluminizada no pacote, o suficiente para fechar as emendas de uma cobertura de 25 m².',\n  'mt-foil-100f': 'Acompanha duas fitas de emenda — a combinação usada em telhado inteiro, onde a metragem exige mais de uma corrida de manta.',\n  'mt-fu-100': 'A maior metragem da linha face única, com duas fitas de emenda inclusas. Indicada para telhado completo em uma única compra.',\n  'tl-kit10': 'Kit fechado de cobertura: 10 telhas de policarbonato onda alta (2,44 adient(160deg,#012E53,#004074)', ink:'#FFFFFF', logo:'assets/logo-branco-laranja.png' },\n];\n\nconst PATTERNS = {\n  none: { label:'LISO', css:'none', op:0 },\n  grid: { label:'GRADE', css:'repeating-linear-gradient(0deg,ACC 0 2px,transparent 2px 90px),repeating-linear-gradient(90deg,ACC 0 2px,transparent 2px 90px)', op:.35 },\n  diag: { label:'DIAGONAL', css:'repeating-linear-gradient(-45deg,ACC 0 24px,transparent 24px 72px)', op:.16 },\n  telha: { label:'TELHA', css:'repeating-linear-gradient(90deg,ACC 0 6px,transparent 6px 46px)', op:.2 },\n};\n\nconst COPY_BASE = [\n  {\n    titulo:'A manta térmica não esfria: ela impede o calor de entrar',\n    legenda:'Telha esquenta. O que muda a temperatura de dentro é a barreira entre a telha e o forro.\\n\\nA manta térmica reflete o calor antes que ele chegue ao ambiente — e no inverno faz o caminho inverso, segurando o calor dentro.\\n\\nAplicação limpa, seca, sobreposição respeitada. É isso que garante o resultado.',\n    hashtags:'#llevlar #mantatermica #conforototermico #obra',\n  },\n  {\n    titulo:'Infiltração começa pela emenda, não pela manta',\n    legenda:'Na maioria das obras que voltam com problema, a manta está inteira. O que falhou foi a emenda.\\n\\nSuperfície suja, superfície úmida ou sobreposição menor que a indicada: qualquer um dos três abre caminho para a água.\\n\\nAntes de aplicar a fita asfáltica: limpa, seca, sobreposta.',\n    hashtags:'#llevlar #fitaasfaltica #impermeabilizacao #aplicador',\n  },\n  {\n    titulo:'Onde a fita asfáltica resolve em minutos',\n    legenda:'Rufo solto, calha com trinca, emenda de telha, ponto de parafuso: são os pontos onde a água entra primeiro e onde o reparo é mais rápido.\\n\\nA fita asfáltica veda por adesão direta — sem obra, sem espera de cura.\\n\\nSalva esse post para a próxima manutenção.',\n    hashtags:'#llevlar #fitaasfaltica #manutencao #reparo',\n  },\n];\n\nclass Component extends DCLogic {\n  state = {\n    view: 'portal',\n    tpl: 'passo',\n    ta ha. */\n  usePauta(t){\n    this.save({ view:'studio', sugestao: {\n      nome: t.nome + ' · ' + t.janela,\n      linhas: [\n        ['chamada','CHAMADA', t.nome + ' · ' + t.janela],\n        ['titulo','TÍTULO', t.gancho],\n        ['apoio','APOIO', t.apoioCurto],\n      ],\n    } });\n  }\n\n  async copiarUrl(){\n    const url = this.state.prodUrl;\n    if(!url) return;\n    try { await navigator.clipboard.writeText(url); }\n    catch(e){\n      const ta = document.createElement('textarea');\n      ta.value = url; document.body.appendChild(ta); ta.select();\n      document.execCommand('copy'); ta.remove();\n    }\n    this.setState({ copiado: true });\n    clearTimeout(this._tCopy);\n    this._tCopy = setTimeout(() => this.setState({ copiado: false }), 2000);\n  }\n\n  loadProduct(p){\n    /* Escolher um produto reescreve todos os campos de texto: um produto por vez,\n       o mesmo produto em qualquer modelo. */\n    const curto = p.especs.slice(0, 2).map(e => e[1]).join(' · ');\n    const vals = Object.assign({}, this.state.vals, {\n      produto: p.nome,\n      subtitulo: p.grupo + ' · a partir de ' + p.pix + ' no PIX',\n      por: p.pix,\n      de: p.preco,\n      titulo: p.nome,\n      linha: 'Linha de ' + p.grupo.toLowerCase(),\n      n1: p.nome, pr1: p.pix,\n      chamada: p.grupo,\n      apoio: curto + ' · a partir de ' + p.pix + ' no PIX',\n      destaque: p.especs[0][1],\n      pergunta: p.nome + ': o que vem na embalagem?',\n      resposta: p.especs.map(e => e[0].toLowerCase() + ' ' + e[1]).join(', ') + '. Preço de ' + p.pix + ' no PIX ou depósito.',\n      cta: 'Fale com a LLEV Lar',\n    });\n    const TAG_POR_GRUPO = { 'Telhas':'telhas', 'Mantas térmicas':'termico', 'Fitas asfálticas':'imperm', 'Impermeabilização':'imperm', 'Proteção e ventilação':'manutencao', 'Reformas e lonas':'aplicacao' };\n    const tag = TAG_POR_GRUPO[p.grupo] || this.state.tag;\n    p.especs.forEach((e, i) => {\n      vals['k' + (i + 1)] = e[0];\n      vals['v' + (i + 1)] = e[ mato de imagem não reconhecido. Use PNG, JPG ou WEBP.' });\n\n    this.setState({ revLoading: true, revErr: '', revResult: null, revSeg: 0 });\n    clearInterval(this._revTick);\n    this._revTick = setInterval(() => this.setState(st => ({ revSeg: st.revSeg + 1 })), 1000);\n\n    const prompt = [\n      'Você revisa artes de redes sociais da LLEV Lar, loja online de materiais para telhado, impermeabilização e conforto térmico. Escreva em português do Brasil, tom técnico e direto de lojista de material de construção — sem marketing vazio, sem emoji.',\n      '',\n      'PASSO OBRIGATÓRIO ANTES DE QUALQUER JULGAMENTO — TRANSCRIÇÃO LITERAL:',\n      'Transcreva TODO texto visível na arte exatamente como aparece, letra por letra, na ordem em que aparece. Não corrija, não complete, não normalize nada durante a transcrição: se está escrito \"anta Térmica\", transcreva \"anta Térmica\". Se uma letra está cortada pela borda, faltando ou coberta, transcreva o que se vê de fato. Só depois de transcrever é que você avalia.',\n      '',\n      'Ao revisar o texto, compare cada palavra transcrita com a grafia correta do português e com o nome real do produto no catálogo. Verifique um por um:',\n      '- Primeira letra faltando ou cortada pela margem (erro comum de arte: \"anta\" em vez de \"Manta\", \"elha\" em vez de \"Telha\").',\n      '- Palavra truncada, letra dobrada ou letra trocada.',\n      '- Acento errado, faltando ou sobrando; crase; maiúscula no meio da palavra.',\n      '- Concordância, plural e pontuação.',\n      '- Nome do produto diferente do nome no catálogo.',\n      'Qualquer palavra transcrita que não seja uma palavra correta do português ou o nome exato do produto é nivel \"erro\" — mesmo que a intenção seja óbvia. Palavra cortada é erro de publicação, não detalhe de design.',\n      'Só afirme que não há erro de português depois de ter conferido cada palavra da transcrição. Nunca use \"ok\" para a frente TEXTO sem que a transcrição esteja inteira e correta.',\n      '',\n      'Revise a arte da imagem em três frentes:',\n      '1. DESIGN — hierarquia, legibilidade em tela de celular, contraste, respiro, alinhamento, uso do logo, e se algum texto está saindo da margem ou sendo cortado.',\n      '2. TEXTO — grafia, ortografia, acento, concordância, palavra cortada ou incompleta, clareza, promessa exagerada, chamada para ação.',\n      '3. PRODUTO — confira tudo que a arte afirma contra o catálogo abaixo: nome do produto, preço, medida, metragem, especificação. Aponte divergência com o valor certo. Atenção aos avisos do fabricante: a manta térmica NÃO é auto adesiva e não serve para uso externo; a fita asfáltica é auto adesiva e dispensa maçarico; calço e parafuso precisam ser do mesmo perfil da telha (075 onda baixa, 177 onda alta); o primer asfáltico rende 0,3 a 0,5 L/m². Se a arte não citar produto, diga isso em vez de inventar erro.',\n      '',\n      'Nunca invente história, fundação ou posicionamento da marca. Só use como fato o que estiver no catálogo.',\n      '',\n      'CATÁLOGO:',\n      this.catalogoTxt(),\n      s.revCtx ? '\\nCONTEXTO DADO PELO USUÁRIO: ' + s.revCtx : '',\n      '',\n      'Responda SOMENTE com JSON válido, sem cercas de código, neste formato:',\n      '{\"transcricao\": \"todo o texto da arte, literal\", \"nota\": 0-10 inteiro, \"veredito\": \"PODE PUBLICAR\" | \"AJUSTAR ANTES\" | \"NÃO PUBLICAR\", \"resumo\": \"2 frases\", \"design\": [{\"nivel\":\"ok|atencao|erro\",\"titulo\":\"curto\",\"txt\":\"o que fazer\"}], \"texto\": [...mesmo formato], \"produto\": [...mesmo formato]}',\n      'De 2 a 5 itens por frente. \"nivel\" erro é o que impede publicar, atencao é melhoria, ok é acerto que vale manter.',\n      'Se houver qualquer item de nivel \"erro\" em qualquer frente, o veredito NÃO pode ser \"PODE PUBLICAR\" e a nota não passa de 5. Um erro de grafia sozinho já derruba o veredito.',\n    ].join('\\n');\n\n    try {\n      const r = await fetch('https://api.anthropic.com/v1/messages'
